name: Build Automation e CI

# La pipeline deve essere eseguita automaticamente ad ogni push/Pull Request
on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Preparazione dell'ambiente
    - name: Checkout del codice sorgente
      uses: actions/checkout@v3

    - name: Configurazione Java JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    # 2. Compilazione del progetto (eseguita nella fase di compile)
    - name: Fase di Compilazione
      run: mvn compile

    # 3. Esecuzione dei test (eseguita nella fase di test) con JaCoCo per il coverage
    - name: Fase di Test e Code Coverage
      run: mvn test

    # 4. Analisi statica del codice (eseguita nella fase di package tramite Checkstyle)
    - name: Fase di Package e Controllo Qualità (Checkstyle)
      run: mvn package

    # 5. Calcolo del code coverage tramite Coveralls
    - name: Pubblicazione Code Coverage su Coveralls
      uses: coverallsapp/github-action@v2
      with:
        file: target/site/jacoco/jacoco.xml